<section class="section auth-page">
  <div class="container auth-page__container">
    <div class="card auth-page__card">
      <h1 class="auth-page__title">Најава</h1>
      <p class="auth-page__subtitle">Најавете се за да пристапите до вашата VIP содржина.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-page__form">
        <div class="form-group">
          <label class="form-label" for="email">Е-пошта</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Лозинка</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
            autocomplete="current-password"
          />
        </div>

        @if (errorMessage()) {
          <p class="form-error">{{ errorMessage() }}</p>
        }

        <button type="submit" class="btn btn-primary btn-block" [disabled]="submitting()">
          {{ submitting() ? 'Најавување…' : 'Најави се' }}
        </button>
      </form>

      <p class="auth-page__switch">
        Нема сметка? <a routerLink="/signup">Регистрирај се</a>
      </p>
    </div>
  </div>
</section>
