<section class="section page-header">
  <div class="container">
    <p class="eyebrow">Евиденција</p>
    <h1 class="section-title">Последни Резултати</h1>
    <p class="section-subtitle">
      Последните завршени тикети, победи и порази подеднакво. За целосната историја, погледни ја
      целосната архива.
    </p>
  </div>
</section>

<section class="section section--top-pad">
  <div class="container">
    @if (loading()) {
      <app-loading-spinner />
    } @else if (error()) {
      <app-empty-state title="Не успеавме да ги вчитаме резултатите" message="Ве молиме освежете ја страницата или обидете се повторно наскоро." />
    } @else if (tickets().length === 0) {
      <app-empty-state title="Сè уште нема резултати" message="Завршените тикети ќе се појават тука откако ќе се оценат првите избори." />
    } @else {
      <div class="card-grid">
        @for (ticket of tickets(); track ticket.id) {
          <app-ticket-card [ticket]="ticket" />
        }
      </div>
    }
  </div>
</section>
