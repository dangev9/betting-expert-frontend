<section class="section page-header">
  <div class="container">
    <p class="eyebrow">Профил</p>
    <h1 class="section-title">Мојата сметка</h1>
  </div>
</section>

<section class="section section--top-pad">
  <div class="container account-layout">
    @if (loading()) {
      <app-loading-spinner />
    } @else if (me(); as user) {
      <div class="card account-summary">
        <p class="account-summary__row"><span>Е-пошта</span> {{ user.email }}</p>
        <p class="account-summary__row">
          <span>VIP статус</span>
          @if (user.vipActive) {
            <span class="badge badge-active">VIP до {{ user.vipExpiresAt | date: 'd MMM y, HH:mm' }}</span>
          } @else {
            <span class="badge badge-void">Нема VIP</span>
          }
        </p>
      </div>
    }

    <div class="card account-password">
      <h2 class="account-password__title">Промени лозинка</h2>
      <app-change-password-form />
    </div>
  </div>
</section>
