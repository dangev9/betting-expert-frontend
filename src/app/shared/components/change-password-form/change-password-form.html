<form [formGroup]="form" (ngSubmit)="submit()" class="change-password-form">
  <div class="form-group">
    <label class="form-label" for="currentPassword">Тековна лозинка</label>
    <input
      id="currentPassword"
      type="password"
      class="form-control"
      formControlName="currentPassword"
      [class.is-invalid]="form.controls.currentPassword.invalid && form.controls.currentPassword.touched"
      autocomplete="current-password"
    />
  </div>

  <div class="form-group">
    <label class="form-label" for="newPassword">Нова лозинка</label>
    <input
      id="newPassword"
      type="password"
      class="form-control"
      formControlName="newPassword"
      [class.is-invalid]="form.controls.newPassword.invalid && form.controls.newPassword.touched"
      autocomplete="new-password"
    />
    @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
      <span class="form-error">Лозинката мора да има најмалку 8 карактери.</span>
    }
  </div>

  <div class="form-group">
    <label class="form-label" for="confirmPassword">Потврди нова лозинка</label>
    <input
      id="confirmPassword"
      type="password"
      class="form-control"
      formControlName="confirmPassword"
      [class.is-invalid]="form.controls.confirmPassword.invalid && form.controls.confirmPassword.touched"
      autocomplete="new-password"
    />
  </div>

  @if (errorMessage()) {
    <p class="form-error">{{ errorMessage() }}</p>
  }
  @if (successMessage()) {
    <p class="change-password-form__success">{{ successMessage() }}</p>
  }

  <button type="submit" class="btn btn-primary" [disabled]="submitting()">
    {{ submitting() ? 'Се зачувува…' : 'Промени лозинка' }}
  </button>
</form>
