<header class="navbar">
  <div class="navbar__inner container">
    <a routerLink="/" class="navbar__brand" (click)="closeMenu()">
      Betting<span>Expert</span>
    </a>

    <nav class="navbar__links" [class.navbar__links--open]="isMenuOpen()">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="navbar__link--active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="navbar__link"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
      <a routerLink="/vip" class="btn btn-primary navbar__cta" (click)="closeMenu()">Join VIP</a>
    </nav>

    <button
      type="button"
      class="navbar__toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Toggle navigation menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
