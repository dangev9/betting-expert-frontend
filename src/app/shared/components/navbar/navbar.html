<header class="navbar">
  <div class="navbar__inner container">
    <a routerLink="/" class="navbar__brand" (click)="closeMenu()">
      <img src="/logo-lockup.png" alt="Betting Expert" class="navbar__logo" />
    </a>

    <nav class="navbar__links" [class.navbar__links--open]="isMenuOpen()">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="navbar__link--active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="navbar__link"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
      <a routerLink="/vip" class="btn btn-primary navbar__cta" (click)="closeMenu()">Придружи се на VIP</a>

      @if (isAuthenticated()) {
        <a routerLink="/account" class="navbar__link" (click)="closeMenu()">Профил</a>
        <button type="button" class="btn btn-ghost btn-sm navbar__logout" (click)="logout()">Одјава</button>
      } @else {
        <a routerLink="/login" class="navbar__link" (click)="closeMenu()">Најава</a>
      }
    </nav>

    <button
      type="button"
      class="navbar__toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Отвори мени"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
